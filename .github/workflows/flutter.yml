name: Flutter checks
on:
  push:
  pull_request:
jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Generate Android and iOS scaffolding
        run: flutter create --platforms=android,ios .
          rm -f test/widget_test.dart
      - name: Resolve dependencies
        run: flutter pub get
      - name: Generate localization sources
        run: flutter gen-l10n
      - name: Analyze Dart sources
        run: flutter analyze
      - name: Run tests
        run: flutter test
